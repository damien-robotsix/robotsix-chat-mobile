allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Provide the Flutter extension to subprojects that use the old Flutter Gradle
// plugin API (e.g. package_info_plus v9 accesses flutter.compileSdkVersion).
// Flutter 3.24's declarative plugin system only applies it to :app.  Must run
// before subproject evaluation, so no afterEvaluate wrapper.
subprojects { sub ->
    if (sub != rootProject) {
        sub.ext.flutter = [
            compileSdkVersion: 34,
            minSdkVersion: 24,
            targetSdkVersion: 34,
            ndkVersion: "27.0.12077973",
        ]
    }
}

// Fix missing namespace and compileSdkVersion on older Flutter plugins that
// do not declare them (required by AGP 8.x).  Wrapped in try/catch because
// the Flutter Gradle plugin's included build contributes projects that are
// already evaluated when subprojects blocks run.
subprojects {
    try {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                    compileSdkVersion 34
                }
            }
        }
    } catch (Exception ignored) {
        // Already evaluated — skip.
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
