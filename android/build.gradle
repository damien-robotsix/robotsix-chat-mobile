allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Workaround for older Flutter plugins that do not declare namespace or
// compileSdkVersion, which are required by AGP 8.x.  Wrapped in a try/catch
// because the Flutter Gradle plugin's included build may contribute projects
// that are already evaluated when the subprojects block runs.
subprojects {
    try {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                    compileSdkVersion 34
                }
            }
        }
    } catch (Exception ignored) {
        // Project already evaluated — skip.
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
