plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace "com.robotsix.chat_mobile"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.robotsix.chat_mobile"
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    def keystoreBase64 = System.getenv("KEYSTORE_BASE64")
    def keystorePropertiesFile = rootProject.file("key.properties")
    def hasReleaseKeystore = (keystoreBase64 != null && !keystoreBase64.isEmpty()) || keystorePropertiesFile.exists()

    signingConfigs {
        release {
            // Prefer environment variables (CI) over key.properties (local).
            if (keystoreBase64 != null && !keystoreBase64.isEmpty()) {
                def keystoreFile = rootProject.file("release.keystore")
                keystoreFile.withOutputStream { out ->
                    out.write(keystoreBase64.decodeBase64())
                }
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystorePropertiesFile.withReader("UTF-8") { reader ->
                    keystoreProperties.load(reader)
                }
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Use a real release keystore when one is available; otherwise fall
            // back to the built-in debug signing config so release builds still
            // succeed on a clean machine with no signing keys configured. AGP
            // auto-generates the debug keystore only for the built-in debug
            // config, not for a custom config that copies its fields.
            signingConfig (hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug)
        }
    }
}

flutter {
    source "../.."
}
