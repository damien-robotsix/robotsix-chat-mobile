name: release-apk

# Builds the signed release APK and attaches it to the GitHub Release that
# release-please publishes for a v{version} tag. This replaces the old
# hand-rolled, version-grepping `release` job that lived in ci.yml.
#
# release-please creates the release using a GitHub App installation token, so
# this `release` event fires (unlike releases created with the default
# GITHUB_TOKEN, which do not trigger further workflows).

on:
  release:
    types: [published]

# Never run two release builds for the same tag at once, and never cancel an
# in-flight signed build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-and-upload:
    name: build-and-upload
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload the APK as an asset of the published release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # Caching is disabled in this release workflow so the signed artifact is
      # never built from a cache another (less trusted) workflow could poison.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: false

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          cache-disabled: true

      - run: flutter pub get

      # android/app/build.gradle falls back to debug signing when no release
      # keystore is configured (convenient for local builds). In CI that would
      # silently publish a debug-signed APK that the in-app updater offers but
      # Android refuses to install over the release-signed app, so fail fast
      # when any signing secret is missing.
      - name: Check release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error title=Missing release signing secrets::Required secret(s) not set: ${missing[*]}. Refusing to build a debug-signed release APK."
            exit 1
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        # The semver (build name) comes from pubspec.yaml, which release-please
        # bumps. The Android build number (versionCode) is injected here from the
        # monotonically increasing CI run number so each release installs cleanly
        # as an upgrade.
        run: flutter build apk --build-number="$BUILD_NUMBER"

      # Defence in depth: never upload an APK signed with the Android debug
      # certificate, even if the Gradle fallback is hit for another reason.
      - name: Verify APK is not debug-signed
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apksigner="$build_tools_dir/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error title=apksigner not found::No apksigner under $ANDROID_HOME/build-tools."
            exit 1
          fi
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if grep -q "CN=Android Debug" <<<"$certs"; then
            echo "::error title=Debug-signed release APK::$apk is signed with the Android debug certificate. Refusing to publish it."
            exit 1
          fi

      # `gh release upload` fails if the APK is missing, so an absent build
      # output cannot silently produce an asset-less release.
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" build/app/outputs/flutter-apk/app-release.apk --clobber
