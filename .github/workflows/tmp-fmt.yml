name: tmp-fmt

on:
  push:
    branches:
      - "mill/20260906T194711Z-enforce-dart-formatting-in-ci-with-dart-4655"

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - run: dart format .

      - name: Push formatted output to scratch branch
        run: |
          git config user.name "robotsix-mill"
          git config user.email "mill@robotsix.local"
          git checkout -B mill/fmt-out
          git add -A
          git commit -m "chore: dart format output (toolchain 3.47.2)" || echo "no changes"
          git push -f origin mill/fmt-out
