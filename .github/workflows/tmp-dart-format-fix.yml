name: tmp-dart-format-fix

on:
  push:
    branches:
      - mill/20260906T194711Z-enforce-dart-formatting-in-ci-with-dart-4655

concurrency:
  group: tmp-dart-format-fix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: false

      - run: flutter pub get

      - name: Capture analyze output (before fixes)
        run: flutter analyze > tmp-analyze-before.txt 2>&1 || true

      - name: Apply analyzer auto-fixes
        run: dart fix --apply || true

      - name: Apply dart format
        run: dart format .

      - name: Capture analyze output (after fixes)
        run: flutter analyze > tmp-analyze-after.txt 2>&1 || true

      - name: Commit diagnostics + fixes, push (helper kept for mill-PAT cleanup)
        run: |
          set -euo pipefail
          git config user.name "robotsix-mill"
          git config user.email "mill@robotsix.local"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -q -m "chore: capture flutter analyze diagnostics and apply dart fix/format"
            git push
          fi
          git rev-parse HEAD
